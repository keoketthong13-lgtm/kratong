<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>กระทงคู่ออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --night: #0a1128;
  --panel: #101a38;
  --field: #0a1330;
  --ink: #eaeefa;
  --mute: #9aa6c8;
  --flame: #ffb347;
  --flame-ink: #2b1800;
  --line: rgba(160, 182, 235, 0.18);
  --good: #84e3b4;
  --bad: #ff9a9a;
  --font-display: "Chonburi", "Noto Serif Thai", serif;
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}
h1, h2 { margin: 0; font-weight: 400; text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.river { position: relative; height: clamp(320px, 58vw, 480px); overflow: hidden; background: var(--night); }
.river canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; }
.river-in {
  position: relative; max-width: 880px; margin: 0 auto; padding-top: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.river h1 { font-family: var(--font-display); font-size: clamp(26px, 5.2vw, 42px); line-height: 1.25; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55); }
.river-in p { margin: 4px 0 0; max-width: 36ch; font-size: 14px; color: #c3cdea; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7); }
.pick {
  position: absolute; bottom: 10px; margin: 0;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 420px; padding: 9px 14px; border-radius: 10px;
  background: rgba(6, 11, 30, 0.78); border: 1px solid var(--line);
  pointer-events: none;
}
.pick .nm { font-weight: 600; }
.pick .wish { margin-top: 2px; font-size: 14px; color: var(--mute); overflow-wrap: anywhere; }

.wrap {
  max-width: 880px; margin: 0 auto; display: grid; gap: 36px;
  padding-block: 22px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap h2 { font-family: var(--font-display); font-size: 21px; }
.launch { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; }
.launch form { display: grid; gap: 16px; margin: 0; }
.ff { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 16px; }
.ff:disabled { opacity: 0.55; }
.pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
.pair .amp { padding-bottom: 14px; color: var(--flame); display: flex; }
.fld { display: grid; gap: 6px; min-width: 0; }
.fld label, .hues-label { font-size: 14px; color: var(--mute); }
input[type="text"] {
  width: 100%; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
input[type="text"]::placeholder { color: #66729a; }
input[type="text"]:focus-visible, button:focus-visible, .sw:has(input:focus-visible) { outline: 2px solid var(--flame); outline-offset: 2px; }
.hues { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.sw { position: relative; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; background: hsl(var(--h) 82% 70%); box-shadow: 0 0 14px hsl(var(--h) 90% 60% / 0.45); }
.sw:has(input:checked) { outline: 2px solid var(--ink); outline-offset: 3px; }
.act { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
button { font: inherit; cursor: pointer; }
.go { background: var(--flame); color: var(--flame-ink); border: 0; border-radius: 10px; padding: 13px 26px; font-weight: 600; }
.go:hover:not(:disabled) { filter: brightness(1.08); }
.go:disabled { opacity: 0.6; cursor: default; }
#msg { margin: 0; font-size: 14px; min-height: 1.4em; flex: 1 1 200px; }
#msg.ok { color: var(--good); }
#msg.bad { color: var(--bad); }
.gate { margin: 0; font-size: 14px; color: #ffd9a0; }

.listhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
#count { color: var(--mute); font-size: 14px; font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row.empty { display: block; color: var(--mute); }
.dot { width: 10px; height: 10px; margin-top: 8px; border-radius: 50%; background: hsl(var(--h) 85% 70%); box-shadow: 0 0 12px hsl(var(--h) 90% 62%); }
.names { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.names .heart { display: inline-flex; color: hsl(var(--h) 85% 72%); }
.badge { font-size: 12px; font-weight: 500; color: var(--flame); border: 1px solid rgba(255, 179, 71, 0.45); border-radius: 999px; padding: 0 8px; }
.wish { margin: 2px 0 0; font-size: 14px; color: var(--mute); overflow-wrap: anywhere; }
.side { display: grid; justify-items: end; gap: 6px; font-size: 12px; color: var(--mute); text-align: right; min-width: 0; }
.rm { background: none; border: 1px solid var(--line); color: var(--mute); border-radius: 8px; padding: 3px 10px; font-size: 12px; }
.rm.sure { border-color: var(--bad); color: var(--bad); }
.more { margin-top: 14px; background: none; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 18px; }
.foot { margin: 0; font-size: 13px; color: var(--mute); }

@media (max-width: 480px) {
  .pair { grid-template-columns: 1fr; }
  .pair .amp { display: none; }
  .launch { padding: 16px; }
  .row { grid-template-columns: auto 1fr; }
  .side { grid-column: 2; justify-items: start; text-align: left; grid-auto-flow: column; justify-content: start; align-items: center; gap: 12px; }
}
</style>
</head>
<body>

<header class="river" id="river">
  <canvas id="cv" role="img" aria-label="แม่น้ำยามค่ำคืนที่มีกระทงของแต่ละคู่ลอยอยู่ แตะกระทงเพื่ออ่านคำอธิษฐาน"></canvas>
  <div class="river-in">
    <h1>กระทงคู่ออนไลน์</h1>
    <p>เขียนชื่อสองคนลงในกระทง แล้วปล่อยลงแม่น้ำสายเดียวกับเพื่อน ๆ</p>
  </div>
  <p class="pick" id="pick" hidden></p>
</header>

<main class="wrap">
  <section class="launch" aria-labelledby="h-launch">
    <h2 id="h-launch">ลอยกระทงของคุณ</h2>
    <p class="gate" id="gate" hidden></p>
    <form id="f" novalidate>
      <fieldset class="ff" id="ff">
        <div class="pair">
          <div class="fld">
            <label for="n1">ชื่อคนที่ 1</label>
            <input type="text" id="n1" maxlength="20" autocomplete="off" placeholder="ชื่อเล่น">
          </div>
          <span class="amp" aria-hidden="true"><svg viewBox="0 0 24 22" width="20" height="18"><path d="M12 21C5 15 1 11.5 1 7.2 1 4 3.5 1.8 6.3 1.8c2.3 0 4.2 1.3 5.7 3.5 1.5-2.2 3.4-3.5 5.7-3.5C20.5 1.8 23 4 23 7.2 23 11.5 19 15 12 21z" fill="currentColor"/></svg></span>
          <div class="fld">
            <label for="n2">ชื่อคนที่ 2</label>
            <input type="text" id="n2" maxlength="20" autocomplete="off" placeholder="ชื่อเล่น">
          </div>
        </div>
        <div class="fld">
          <label for="wish">คำอธิษฐาน (ไม่ใส่ก็ได้)</label>
          <input type="text" id="wish" maxlength="60" autocomplete="off" placeholder="ขอให้เราสองคนอยู่ด้วยกันไปนาน ๆ">
        </div>
        <div>
          <span class="hues-label" id="hl">สีกระทง</span>
          <div class="hues" role="radiogroup" aria-labelledby="hl" id="hues"></div>
        </div>
        <div class="act">
          <button type="submit" class="go" id="go">ลอยกระทง</button>
          <p id="msg" role="status"></p>
        </div>
      </fieldset>
    </form>
  </section>

  <section aria-labelledby="h-list">
    <div class="listhead">
      <h2 id="h-list">กระทงในแม่น้ำ</h2>
      <span id="count">0 ใบ</span>
    </div>
    <ol class="list" id="list"></ol>
    <button type="button" class="more" id="more" hidden></button>
  </section>

  <p class="foot" id="foot">แต่ละเครื่องลอยได้สูงสุด 5 ใบ และดึงกลับได้เฉพาะกระทงของตัวเอง</p>
</main>

<script src="config.js"></script>
<script>window.CONFIG = window.CONFIG || { apiKey: '', projectId: '' }; var CONFIG = window.CONFIG;</script>

<script>
(function () {
  'use strict';
  var TAU = Math.PI * 2;
  var HUES = [335, 14, 45, 160, 265, 205];
  var HUE_TH = ['ชมพู', 'ส้ม', 'ทอง', 'เขียว', 'ม่วง', 'ฟ้า'];
  var MAX_EACH = 5;

  var FS = 'https://firestore.googleapis.com/v1/projects/' + CONFIG.projectId + '/databases/(default)/documents/krathongs';
  var LS_UID = 'krathong_uid', LS_ITEMS = 'krathong_local_items';
  var HEART = 'M12 21C5 15 1 11.5 1 7.2 1 4 3.5 1.8 6.3 1.8c2.3 0 4.2 1.3 5.7 3.5 1.5-2.2 3.4-3.5 5.7-3.5C20.5 1.8 23 4 23 7.2 23 11.5 19 15 12 21z';
  var HEART_SVG = '<svg viewBox="0 0 24 22" width="15" height="14" aria-hidden="true"><path d="' + HEART + '" fill="currentColor"/></svg>';

  var cv = $('cv'), ctx = cv.getContext('2d');

  var W = 0, H = 0, dpr = 1;

  var items = [];
  var hits = [];
  var launched = new Map();
  var selected = null;
  var showAll = false;
  var confirmId = null;
  var hueIdx = 0;
  var S = { uid: null, busy: false };
  var SAMPLE = { key: 'sample', a: 'ชื่อคุณ', b: 'ชื่อเขา', w: '', h: 0, t: 0, sample: true };

  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  function clean(s, n) { return String(s || '').replace(/\s+/g, ' ').trim().slice(0, n); }
  function rid() { return Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6); }
  function cut(s) { var a = Array.from(s); return a.length > 14 ? a.slice(0, 13).join('') + '…' : s; }

  /* ---------- canvas ---------- */
  function resize() {
    var r = $('river').getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    var rand = rng(7), n = Math.round(W / 9), hz = H * 0.3;
    stars = [];
    for (var i = 0; i < n; i++) stars.push({ x: rand() * W, y: rand() * hz * 0.95, r: 0.4 + rand() * 0.9, ph: rand() * 6 });

  }

  function chedi(cx, y, h, w) {
    ctx.beginPath();
    ctx.moveTo(cx - w, y); ctx.lineTo(cx - w, y - h * 0.18);
    ctx.quadraticCurveTo(cx - w * 0.9, y - h * 0.5, cx - w * 0.25, y - h * 0.72);
    ctx.lineTo(cx - w * 0.06, y - h * 0.9); ctx.lineTo(cx, y - h); ctx.lineTo(cx + w * 0.06, y - h * 0.9);

  }
  function bank(hz) {
    ctx.fillStyle = '#050a1b';

    chedi(W * 0.58, hz, h1 * 0.7, h1 * 0.2);
  }

  function scene(t) {
    var hz = H * 0.3, g, i;
    g = ctx.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#060b1c'); g.addColorStop(1, '#1b2c5e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz + 1);
    ctx.fillStyle = '#dfe8ff';
    for (i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = 0.35 + 0.5 * (0.5 + 0.5 * Math.sin(t * 1.2 + s.ph));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    var mx = W * 0.82, my = hz * 0.46, mr = Math.max(11, Math.min(20, W * 0.03));
    g = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4.5);
    g.addColorStop(0, 'rgba(215,226,255,0.38)'); g.addColorStop(1, 'rgba(215,226,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, mr * 4.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#eef0ff'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
    for (i = 0; i < 9; i++) {
      var sp = 3 + (i % 3) * 1.4, span = hz + 20;
      var yy = hz + 6 - ((t * sp + i * 29) % span);
      var xx = ((i * 0.618034) % 1) * W + Math.sin(t * 0.6 + i) * 5;
      var a = Math.max(0, Math.min(1, yy / 20)) * Math.max(0, Math.min(1, (hz + 6 - yy) / 12));
      if (a <= 0) continue;
      ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'lighter';
      g = ctx.createRadialGradient(xx, yy, 0, xx, yy, 12);

      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(xx, yy, 12, 0, TAU); ctx.fill();

    ctx.save(); ctx.beginPath(); ctx.rect(0, hz, W, H - hz); ctx.clip();

    bank(hz);
    ctx.fillStyle = '#e6ecff';
    for (i = 0; i < 15; i++) {
      var wy = hz + i * (H - hz) / 17, ww = 34 * (1 - i / 20) * (0.6 + 0.4 * Math.sin(t * 2 + i));
      ctx.globalAlpha = 0.28 * (1 - i / 16); ctx.fillRect(mx - ww / 2, wy + 2, ww, 1.5);
    }

  var RINGS = [
    { n: 12, rad: 12, len: 11, wid: 5, lift: -2, l: 70, ph: 0 },
    { n: 9, rad: 6.5, len: 8, wid: 4, lift: -6, l: 82, ph: 0.3 }

  function drawK(x, y, s, hue, ph, t, lit, alpha) {
    var g;
    ctx.save(); ctx.globalAlpha = alpha;
    if (lit > 0) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.translate(x, y + 3 * s); ctx.scale(1, 0.3);

    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 24, 8.5, 0, 0, TAU); ctx.fill();

      ctx.save(); ctx.globalCompositeOperation = 'lighter';

      g.addColorStop(0, 'rgba(255,200,110,0.5)'); g.addColorStop(1, 'rgba(255,200,110,0)');

      ctx.restore();

      ctx.fillStyle = g; ctx.beginPath();

      ctx.bezierCurveTo(-4 * f, 3, -5 * f, -3 * f, 0, -9 * f); ctx.fill();

    }
    ctx.restore();
  }

  function pill(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  }
  function label(x, y, s, it, alpha) {
    var fs = Math.max(11, 12.5 * s);
    ctx.font = '500 ' + fs + 'px ' + FONT;
    var A = cut(it.a), B = cut(it.b);
    var wa = ctx.measureText(A).width, wb = ctx.measureText(B).width;
    var hk = fs * 0.78, gap = fs * 0.45, tw = wa + gap + hk + gap + wb, ly = y + 24 * s;
    var px = fs * 0.6, ph = fs * 0.55, bh = fs + ph * 2;
    ctx.save();
    ctx.globalAlpha = alpha * 0.62; ctx.fillStyle = '#050a1c'; pill(x - tw / 2 - px, ly - bh / 2, tw + px * 2, bh, bh / 2);
    ctx.globalAlpha = alpha; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillStyle = '#f4f0e6';
    var x0 = x - tw / 2;
    ctx.fillText(A, x0, ly + 0.5);
    var k = hk / 24;
    ctx.save(); ctx.translate(x0 + wa + gap, ly - 11 * k); ctx.scale(k, k);
    ctx.fillStyle = 'hsl(' + HUES[it.h] + ' 85% 70%)'; ctx.fill(heartPath); ctx.restore();
    ctx.fillText(B, x0 + wa + gap + hk + gap, ly + 0.5);
    ctx.restore();
    return { w: tw + px * 2, h: bh, ly: ly };
  }

  function capFor() { var L = W < 520 ? 6 : 8, span = W + 300; return { L: L, span: span, cap: L * Math.max(2, Math.floor(span / 175)) }; }

  function krathongs(now, t) {
    var c = capFor(), L = c.L, span = c.span, hz = H * 0.3;
    var scaleBase = W < 520 ? 0.85 : 1.05;
    var start = Math.max(0, items.length - c.cap), src = [], i;
    if (items.length) for (i = start; i < items.length; i++) src.push({ it: items[i], i: i });
    else src.push({ it: SAMPLE, i: 3 });
    var arr = [];
    for (i = 0; i < src.length; i++) {
      var it = src[i].it, idx = src[i].i, lane = idx % L, q = (lane + 0.5) / L;
      var speed = 6 + 10 * q, j = Math.floor(idx / L);
      var off = ((j * 0.618034 + lane * 0.37) % 1) * span;
      arr.push({
        it: it, key: it.key, lane: lane,
        x: ((now / 1000 * speed + off) % span) - 150,
        y: hz + (H - hz) * (0.16 + 0.7 * q),
        s: (0.62 + 0.55 * q) * scaleBase, ph: (hash(it.key) % 628) / 100
      });
    }
    arr.sort(function (p, q2) { return p.y - q2.y; });
    hits = [];
    for (i = 0; i < arr.length; i++) {
      var e = arr[i];
      if (e.x < -90 || e.x > W + 90) continue;
      var fade = Math.max(0, Math.min(1, (e.x + 90) / 60, (W + 90 - e.x) / 60));
      var base = e.it.sample ? 0.6 : 1;
      var yy = e.y, lit = 1, labelA = 1, age = -1;
      var ls = launched.get(e.key);
      if (ls) {
        age = (Date.now() - ls) / 1000;
        if (age > 2.4) { launched.delete(e.key); age = -1; }
        else {
          var p = Math.min(1, age / 1.0);
          yy = -40 + (e.y + 40) * p * p;
          lit = Math.max(0, Math.min(1, (age - 1.2) / 0.8));
          labelA = Math.max(0, Math.min(1, (age - 1.0) / 0.5));
        }
      }
      if (age > 1.0) {
        var sp = (age - 1.0) / 1.4;
        ctx.save(); ctx.lineWidth = 1.2;
        for (var rr = 0; rr < 3; rr++) {
          var ra = sp - rr * 0.18; if (ra <= 0 || ra >= 1) continue;
          ctx.strokeStyle = 'rgba(255,220,160,' + ((1 - ra) * 0.5) + ')';
          ctx.beginPath(); ctx.ellipse(e.x, e.y + 3 * e.s, ra * 60 * e.s, ra * 18 * e.s, 0, 0, TAU); ctx.stroke();
        }
        ctx.restore();
      }
      if (e.key === selected) {
        ctx.save(); ctx.strokeStyle = 'rgba(255,200,120,' + (0.6 + 0.3 * Math.sin(t * 4)) + ')'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(e.x, e.y + 2 * e.s, 36 * e.s, 13 * e.s, 0, 0, TAU); ctx.stroke(); ctx.restore();
      }
      drawK(e.x, yy, e.s, HUES[e.it.h], e.ph, t, lit, fade * base);
      var lab = label(e.x, e.y, e.s, e.it, fade * base * labelA);
      if (!e.it.sample) hits.push({ key: e.key, x: e.x, y: e.y, s: e.s, w: lab.w, h: lab.h, ly: lab.ly });
    }
    if (!items.length) {
      ctx.save(); ctx.font = '400 12px ' + FONT; ctx.fillStyle = 'rgba(234,238,250,0.7)'; ctx.textAlign = 'center';
      ctx.fillText('ตัวอย่าง: ยังไม่มีกระทงในแม่น้ำ', W / 2, H - 12); ctx.restore();
    }
  }

  function draw() {
    var now = reduce ? T0 : Date.now();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    scene(now / 1000);
    krathongs(now, now / 1000);
  }
  var raf = 0;
  function frame() { raf = 0; draw(); if (!reduce) raf = requestAnimationFrame(frame); }
  function requestDraw() { if (!raf) raf = requestAnimationFrame(frame); }

  cv.addEventListener('pointerdown', function (e) {
    var r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, found = null;
    for (var k = hits.length - 1; k >= 0; k--) {
      var h = hits[k], dx = px - h.x;
      if ((Math.abs(dx) < h.w / 2 + 6 && Math.abs(py - h.ly) < h.h / 2 + 6) || Math.hypot(dx, (py - (h.y - 8 * h.s)) * 1.2) < 30 * h.s) { found = h.key; break; }
    }
    selected = found === selected ? null : found;
    showPick(); requestDraw();
  });

  /* ---------- DOM ---------- */
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function heartSpan(h) { var s = el('span', 'heart'); s.style.setProperty('--h', HUES[h]); s.innerHTML = HEART_SVG; return s; }

  function showPick() {
    var box = $('pick'), it = null;
    for (var i = 0; i < items.length; i++) if (items[i].key === selected) it = items[i];
    if (!it) { box.hidden = true; return; }
    box.replaceChildren();
    var line = el('div', 'nm');
    line.append(it.a + ' ', heartSpan(it.h), ' ' + it.b);
    box.append(line);
    if (it.w) box.append(el('div', 'wish', it.w));
    box.hidden = false;
  }

  function fmt(t) { try { return new Date(t).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }

  var FOOT = CLOUD
    ? 'แต่ละเครื่องลอยได้สูงสุด 5 ใบ และดึงกลับได้เฉพาะกระทงของตัวเอง ทุกคนที่เปิดหน้านี้เห็นแม่น้ำเดียวกัน'
    : 'แต่ละเครื่องลอยได้สูงสุด 5 ใบ และดึงกลับได้เฉพาะกระทงของตัวเอง';

  function renderList() {
    var ul = $('list'), more = $('more');
    ul.replaceChildren();
    $('count').textContent = items.length + ' ใบ';
    var hidden = Math.max(0, items.length - capFor().cap);
    $('foot').textContent = FOOT + (hidden ? ' แม่น้ำแสดงกระทงล่าสุด ' + (items.length - hidden) + ' ใบ ที่เหลือดูได้ในรายชื่อ' : '');
    if (!items.length) {
      ul.append(el('li', 'row empty', 'แม่น้ำยังว่างอยู่ ลอยกระทงใบแรกได้เลย'));
      more.hidden = true; return;
    }
    var arr = items.slice().reverse(), show = showAll ? arr : arr.slice(0, 24);
    show.forEach(function (it) {
      var li = el('li', 'row'); li.style.setProperty('--h', HUES[it.h]);
      li.append(el('span', 'dot'));
      var main = el('div'), names = el('div', 'names');
      names.append(el('span', null, it.a), heartSpan(it.h), el('span', null, it.b));
      var mine = S.uid && it.uid === S.uid;
      if (mine) names.append(el('span', 'badge', 'ของคุณ'));
      main.append(names);
      if (it.w) main.append(el('p', 'wish', it.w));
      var side = el('div', 'side');
      side.append(el('span', null, fmt(it.t)));
      if (mine) {
        var b = el('button', 'rm' + (confirmId === it.key ? ' sure' : ''), confirmId === it.key ? 'ยืนยันดึงกลับ' : 'ดึงกลับ');
        b.type = 'button'; b.dataset.key = it.key; side.append(b);
      }
      li.append(main, side); ul.append(li);
    });
    more.hidden = showAll || arr.length <= 24;
    more.textContent = 'ดูทั้งหมด ' + arr.length + ' ใบ';
  }

  $('more').addEventListener('click', function () { showAll = true; renderList(); });
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('.rm'); if (!b) return;
    var key = b.dataset.key;
    if (confirmId === key) { confirmId = null; removeMine(key); return; }
    confirmId = key; renderList();
    setTimeout(function () { if (confirmId === key) { confirmId = null; renderList(); } }, 3500);
  });

  var hw = $('hues');
  HUES.forEach(function (h, i) {
    var lb = el('label', 'sw'); lb.style.setProperty('--h', h);
    var inp = document.createElement('input');
    inp.type = 'radio'; inp.name = 'hue'; inp.value = i; inp.className = 'sr'; inp.setAttribute('aria-label', HUE_TH[i]);
    if (i === 0) inp.checked = true;
    inp.addEventListener('change', function () { hueIdx = i; });
    lb.append(inp); hw.append(lb);
  });

  function setMsg(text, kind) { var m = $('msg'); m.textContent = text || ''; m.className = kind || ''; }
  function setGate(text) { var g = $('gate'); g.textContent = text || ''; g.hidden = !text; }

  /* ---------- storage (local หรือ Firebase) ---------- */
  function getUid() {
    try {
      var u = localStorage.getItem(LS_UID);
      if (!u) { u = 'u' + rid(); localStorage.setItem(LS_UID, u); }
      return u;
    } catch (e) { return 'u' + rid(); }
  }

  function normalize(x, fallbackUid) {
    if (!x || typeof x.a !== 'string' || typeof x.b !== 'string') return null;
    var id = typeof x.key === 'string' && x.key ? x.key.slice(0, 40) : null;
    if (!id) return null;
    return {
      key: id, uid: typeof x.uid === 'string' ? x.uid : fallbackUid || '',
      a: x.a.slice(0, 20), b: x.b.slice(0, 20), w: typeof x.w === 'string' ? x.w.slice(0, 60) : '',
      h: Number.isInteger(x.h) && x.h >= 0 && x.h < HUES.length ? x.h : 0, t: Number(x.t) || 0
    };
  }

  function setItems(list) {
    var out = [];
    list.forEach(function (x) { var n = normalize(x); if (n) out.push(n); });
    out.sort(function (p, q) { return p.t - q.t || (p.key < q.key ? -1 : 1); });
    items = out;
    if (selected && !items.some(function (x) { return x.key === selected; })) selected = null;
    renderList(); showPick(); requestDraw();
  }

  function localRead() {
    try { var v = JSON.parse(localStorage.getItem(LS_ITEMS) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function localWrite(list) { try { localStorage.setItem(LS_ITEMS, JSON.stringify(list)); } catch (e) {} }

  function fromDoc(d) {
    var f = d.fields || {};
    function sv(k) { return f[k] && typeof f[k].stringValue === 'string' ? f[k].stringValue : ''; }
    function iv(k) { return f[k] && f[k].integerValue != null ? Number(f[k].integerValue) : 0; }
    return { key: String(d.name || '').split('/').pop(), uid: sv('uid'), a: sv('a'), b: sv('b'), w: sv('w'), h: iv('h'), t: iv('t') };
  }

  async function cloudRead() {
    var all = [], token = '', n = 0;
    do {
      var url = FS + '?pageSize=300&key=' + encodeURIComponent(CONFIG.apiKey) + (token ? '&pageToken=' + encodeURIComponent(token) : '');
      var res = await fetch(url);
      if (!res.ok) throw new Error('read ' + res.status);
      var data = await res.json();
      (data.documents || []).forEach(function (d) { all.push(fromDoc(d)); });
      token = data.nextPageToken || ''; n++;
    } while (token && n < 5);
    return all;
  }

  /* ---------- Firebase anonymous auth (REST) ---------- */
  var AUTH = { idToken: '', refresh: '', uid: '', exp: 0 }, authP = null, LS_AUTH = 'krathong_auth';
  function authSave() { try { localStorage.setItem(LS_AUTH, JSON.stringify({ refresh: AUTH.refresh })); } catch (e) {} }
  async function authRun() {
    var k = encodeURIComponent(CONFIG.apiKey), res, d;
    if (!AUTH.refresh) { try { var s = JSON.parse(localStorage.getItem(LS_AUTH) || 'null'); if (s && s.refresh) AUTH.refresh = s.refresh; } catch (e) {} }
    if (AUTH.refresh) {
      res = await fetch('https://securetoken.googleapis.com/v1/token?key=' + k, {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(AUTH.refresh)
      });
      if (res.ok) {
        d = await res.json();
        AUTH.idToken = d.id_token; AUTH.refresh = d.refresh_token; AUTH.uid = d.user_id;
        AUTH.exp = Date.now() + Number(d.expires_in) * 1000; authSave(); return;
      }
    }
    res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + k, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true })
    });
    if (!res.ok) throw new Error('auth ' + res.status);
    d = await res.json();
    AUTH.idToken = d.idToken; AUTH.refresh = d.refreshToken; AUTH.uid = d.localId;
    AUTH.exp = Date.now() + Number(d.expiresIn) * 1000; authSave();
  }
  function ensureAuth() {
    if (AUTH.idToken && Date.now() < AUTH.exp - 60000) return Promise.resolve();
    if (!authP) authP = authRun().finally(function () { authP = null; });
    return authP;
  }
  function authHeaders(extra) {
    var h = extra || {}; h.Authorization = 'Bearer ' + AUTH.idToken; return h;
  }

  async function cloudAdd(it) {
    await ensureAuth();
    var body = { fields: {
      uid: { stringValue: it.uid }, a: { stringValue: it.a }, b: { stringValue: it.b }, w: { stringValue: it.w },
      h: { integerValue: String(it.h) }, t: { integerValue: String(it.t) }
    } };
    var res = await fetch(FS + '?documentId=' + encodeURIComponent(it.key) + '&key=' + encodeURIComponent(CONFIG.apiKey), {
      method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('add ' + res.status);
  }

  async function cloudDel(key) {
    await ensureAuth();
    var res = await fetch(FS + '/' + encodeURIComponent(key) + '?key=' + encodeURIComponent(CONFIG.apiKey), { method: 'DELETE', headers: authHeaders() });
    if (!res.ok) throw new Error('del ' + res.status);
  }

  async function refresh() {
    try { setItems(CLOUD ? await cloudRead() : localRead()); }
    catch (e) { setMsg('อ่านข้อมูลกระทงไม่ได้ ลองรีเฟรชหน้านี้', 'bad'); }
  }

  function myItems() { return items.filter(function (x) { return x.uid === S.uid; }); }

  $('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (S.busy) return;
    var a = clean($('n1').value, 20), b = clean($('n2').value, 20), w = clean($('wish').value, 60);
    if (!a || !b) { setMsg('ใส่ชื่อให้ครบทั้งสองคนก่อนนะ', 'bad'); (a ? $('n2') : $('n1')).focus(); return; }
    if (CLOUD) {
      try { await ensureAuth(); S.uid = AUTH.uid; }
      catch (err) { setMsg('เชื่อมต่อระบบไม่ได้ ตรวจว่าเปิด Anonymous Auth แล้ว (ดู README)', 'bad'); return; }
    }
    if (myItems().length >= MAX_EACH) { setMsg('ลอยครบ ' + MAX_EACH + ' ใบแล้ว ดึงใบเก่ากลับก่อนถึงจะลอยใบใหม่ได้', 'bad'); return; }
    var it = { key: rid(), uid: S.uid, a: a, b: b, w: w, h: hueIdx, t: Date.now() };
    S.busy = true; $('go').disabled = true; setMsg('');
    if (!reduce) launched.set(it.key, Date.now());
    try {
      if (CLOUD) await cloudAdd(it);
      else localWrite(localRead().concat([it]));
      $('n1').value = ''; $('n2').value = ''; $('wish').value = '';
      selected = it.key;
      setItems(items.concat([it]));
      setMsg('ลอยแล้ว ขอให้สมหวัง', 'ok');
      $('river').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      if (CLOUD) refresh();
    } catch (err) {
      launched.delete(it.key); setMsg('ยังลอยไม่สำเร็จ ลองอีกครั้งนะ', 'bad');
    } finally {
      S.busy = false; $('go').disabled = false;
    }
  });

  async function removeMine(key) {
    try {
      if (CLOUD) await cloudDel(key);
      else localWrite(localRead().filter(function (x) { return x.key !== key; }));
      if (selected === key) selected = null;
      setItems(items.filter(function (x) { return x.key !== key; }));
      setMsg('ดึงกระทงกลับแล้ว', 'ok');
    } catch (err) { setMsg('ดึงกลับไม่สำเร็จ ลองอีกครั้งนะ', 'bad'); }
  }

  /* ---------- start ---------- */
  S.uid = getUid();
  if (!CLOUD) setGate('โหมดทดลอง: กระทงจะเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น (ถ้าจะให้เพื่อนเห็นร่วมกัน ให้แก้ไฟล์ config.js ตาม README.md)');
  renderList();
  if (window.ResizeObserver) new ResizeObserver(resize).observe($('river')); else window.addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('500 14px "IBM Plex Sans Thai"'), document.fonts.load('400 30px Chonburi')]).then(requestDraw, requestDraw);
  }
  refresh();
  if (CLOUD) ensureAuth().then(function () { S.uid = AUTH.uid; renderList(); }, function () {});
  if (CLOUD) setInterval(function () { if (!document.hidden && !S.busy) refresh(); }, 8000);
  else window.addEventListener('storage', refresh);
})();
</script>
